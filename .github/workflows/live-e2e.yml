name: Live end-to-end
# Runs the real pipeline against REAL external services: HN + GitHub sources and GitHub Models (free tier),
# on an ephemeral Postgres. Proves discovery, AI analysis, scoring, outreach drafting, planning,
# production and independent QA work with live data — without touching production.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - run: npm ci
        working-directory: worker
      - name: Live pipeline test
        working-directory: worker
        run: npx vitest run test/live.test.ts --reporter=verbose
        env:
          LIVE: '1'
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
