name: Live end-to-end
# Runs the real pipeline against REAL external services: HN + GitHub sources and GitHub Models (free tier),
# on an ephemeral Postgres. Proves discovery, AI analysis, scoring, outreach drafting, planning,
# production and independent QA work with live data — without touching production.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - run: npm ci
        working-directory: worker
      - name: Probe external endpoints (diagnostics; no secrets printed)
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          probe() { echo "== $1"; curl -sS -o /tmp/b -w 'HTTP %{http_code} %{content_type} redirect=%{redirect_url}\n' "${@:2}"; head -c 300 /tmp/b; echo; }
          probe catalog https://models.github.ai/catalog/models -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28'
          probe inference https://models.github.ai/inference/chat/completions -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Reply with the JSON {\"ok\":true}"}],"max_tokens":20}'
          probe hn-search 'https://hn.algolia.com/api/v1/search_by_date?tags=story,author_whoishiring&query=%22Seeking%20freelancer%22&hitsPerPage=3'
      - name: Live pipeline test
        working-directory: worker
        run: npx vitest run test/live.test.ts --reporter=verbose
        env:
          LIVE: '1'
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '<cloudflare-account-id>' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
