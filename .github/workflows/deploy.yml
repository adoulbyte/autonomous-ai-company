name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  database:
    name: Database migrations + owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Missing secret SUPABASE_DB_URL (see docs/SETUP.md)"; exit 1; }
          [ -n "$OWNER_EMAIL" ] || { echo "::error::Missing secret OWNER_EMAIL (see docs/SETUP.md)"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply database migrations
        working-directory: worker
        run: npm ci && npm run migrate
        env: { DATABASE_URL: '${{ secrets.SUPABASE_DB_URL }}', SUPABASE_URL: '${{ secrets.VITE_SUPABASE_URL }}' }
      - name: Register owner (idempotent)
        working-directory: worker
        run: npm run bootstrap-owner
        env: { DATABASE_URL: '${{ secrets.SUPABASE_DB_URL }}', OWNER_EMAIL: '${{ secrets.OWNER_EMAIL }}', SUPABASE_URL: '${{ secrets.VITE_SUPABASE_URL }}' }

  web:
    name: Web app (Cloudflare Workers static assets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets
        id: cfg
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '<cloudflare-account-id>' }}
        run: |
          missing=""
          for s in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            eval v="\${$s}"; [ -z "$v" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then echo "::warning::Web deploy skipped — missing secrets:$missing (see docs/SETUP.md)"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with: { node-version: 22 }
      - name: Build web
        if: steps.cfg.outputs.ok == 'true'
        working-directory: web
        run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Guard — no service keys or DB URLs in the bundle
        if: steps.cfg.outputs.ok == 'true'
        working-directory: web
        env: { KEY: '${{ secrets.VITE_SUPABASE_ANON_KEY }}' }
        run: |
          # The browser key must be the public anon/publishable key, never a secret/service_role key.
          case "$KEY" in sb_secret_*) echo "::error::VITE_SUPABASE_ANON_KEY is a SECRET key; use the anon/publishable key"; exit 1;; esac
          if echo "$KEY" | cut -d. -f2 | base64 -d 2>/dev/null | grep -q '"service_role"'; then echo "::error::VITE_SUPABASE_ANON_KEY is the service_role key; use the anon key"; exit 1; fi
          # No real secret values or connection strings may appear in the bundle.
          if grep -rEl 'sb_secret_[A-Za-z0-9_-]{16,}|postgres(ql)?://[^"'"'"' ]+@' dist; then echo "::error::secret-like value found in build"; exit 1; fi
          echo "bundle guard passed"
      - name: Deploy to Cloudflare Workers
        if: steps.cfg.outputs.ok == 'true'
        working-directory: web
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '<cloudflare-account-id>' }}
