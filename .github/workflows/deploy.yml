name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  database:
    name: Database migrations + owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Missing secret SUPABASE_DB_URL (see docs/SETUP.md)"; exit 1; }
          [ -n "$OWNER_EMAIL" ] || { echo "::error::Missing secret OWNER_EMAIL (see docs/SETUP.md)"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply database migrations
        working-directory: worker
        run: npm ci && npm run migrate
        env: { DATABASE_URL: '${{ secrets.SUPABASE_DB_URL }}' }
      - name: Register owner (idempotent)
        working-directory: worker
        run: npm run bootstrap-owner
        env: { DATABASE_URL: '${{ secrets.SUPABASE_DB_URL }}', OWNER_EMAIL: '${{ secrets.OWNER_EMAIL }}' }

  web:
    name: Web app (Cloudflare Workers static assets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: database
    steps:
      - name: Check required secrets
        id: cfg
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          for s in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            eval v="\${$s}"; [ -z "$v" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then echo "::warning::Web deploy skipped — missing secrets:$missing (see docs/SETUP.md)"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with: { node-version: 22 }
      - name: Build web
        if: steps.cfg.outputs.ok == 'true'
        working-directory: web
        run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Guard — no service keys or DB URLs in the bundle
        if: steps.cfg.outputs.ok == 'true'
        working-directory: web
        run: |
          if grep -rEl 'service_role|postgres(ql)?://|sb_secret_' dist; then echo "::error::secret-like content found in build"; exit 1; fi
      - name: Deploy to Cloudflare Workers
        if: steps.cfg.outputs.ok == 'true'
        working-directory: web
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
