name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check required secrets
        run: |
          missing=""
          for s in SUPABASE_DB_URL VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY OWNER_EMAIL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            eval v="\${$s}"; [ -z "$v" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see docs/SETUP.md)"; exit 1; fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply database migrations
        working-directory: worker
        run: npm ci && npm run migrate
        env: { DATABASE_URL: '${{ secrets.SUPABASE_DB_URL }}' }
      - name: Register owner (idempotent)
        working-directory: worker
        run: npm run bootstrap-owner || echo "::warning::Owner not registered yet — create the owner user in Supabase Auth, then re-run Deploy."
        env: { DATABASE_URL: '${{ secrets.SUPABASE_DB_URL }}', OWNER_EMAIL: '${{ secrets.OWNER_EMAIL }}' }
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Guard — no service keys or DB URLs in the bundle
        working-directory: web
        run: |
          if grep -rEl 'service_role|postgres(ql)?://|sb_secret_' dist; then echo "::error::secret-like content found in build"; exit 1; fi
      - name: Deploy to Cloudflare Workers (static assets)
        working-directory: web
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
