name: Diagnose
# Read-only production health report: aggregated counts only, plus a reachability check of the command center.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['worker/src/tools/**', '.github/workflows/diagnose.yml']
permissions: { contents: read }
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - run: npm ci
        working-directory: worker
      - name: Prospecting source probe
        working-directory: worker
        run: npx tsx src/tools/probe-osm.ts
      - name: Production database report
        working-directory: worker
        run: npx tsx src/tools/diagnose.ts
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Website hosting permission (Cloudflare Pages)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "pages: no Cloudflare token"; exit 0; fi
          if npx --yes wrangler@4 pages project list >/dev/null 2>&1; then echo "pages: ok (websites can be published)"; else echo "pages: NO PERMISSION — the token needs 'Cloudflare Pages: Edit'"; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
