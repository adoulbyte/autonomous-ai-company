name: Test email
# Sends two sample emails (prospecting + quote with logo) to the owner's address (OWNER_EMAIL secret, never printed).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'designed (2 sample emails), plain (one short plain-text email) buttons (2 variants with quick-reply buttons) prospect (the real first-contact email) or mockup (what a prospect receives after clicking yes)'
        default: designed
      trade:
        description: 'for mode mockup: shop=bakery, shop=hairdresser, amenity=restaurant or craft=plumber'
        default: shop=bakery
      reminder:
        description: 'for mode mockup: 1 = show the reminder version (3 buttons)'
        default: '0'
permissions: { contents: read, models: read }
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - run: npm ci
        working-directory: worker
      - name: Send test emails
        working-directory: worker
        run: npx tsx src/tools/send-test-email.ts
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          TEST_MODE: ${{ inputs.mode }}
          TEST_TRADE: ${{ inputs.trade }}
          TEST_REMINDER: ${{ inputs.reminder }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - name: Keep the sample preview (fictitious business)
        if: inputs.mode == 'mockup'
        uses: actions/upload-artifact@v4
        with: { name: mockup-preview, path: worker/preview/, retention-days: 3, if-no-files-found: ignore }
