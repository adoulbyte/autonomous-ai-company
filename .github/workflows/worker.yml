name: Worker
# Bounded, serverless-style worker: schedules due work, drains the durable Postgres queue
# for at most WORKER_TIME_BUDGET seconds, then exits. Nothing needs to stay alive.
on:
  schedule:
    - cron: '23 */2 * * *'   # every 2 hours: always (fits the 2,000 free minutes/month of a private repository)
    - cron: '*/20 * * * *'   # every 20 minutes: only when the repository is public (unlimited free minutes)
  workflow_dispatch:
permissions:
  contents: read
  actions: write              # lets the run start the next one when work is waiting (bounded per day)
  models: read                # lets GITHUB_TOKEN call GitHub Models (free tier) — no extra AI account needed
concurrency: { group: worker, cancel-in-progress: false }
jobs:
  run:
    # The 20-minute schedule is skipped (no minutes used) while the repository is private.
    if: github.event.schedule != '*/20 * * * *' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then echo "SUPABASE_DB_URL secret not set — skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - run: npm ci
        if: steps.cfg.outputs.ok == 'true'
        working-directory: worker
      - name: Run worker
        id: work
        if: steps.cfg.outputs.ok == 'true'
        working-directory: worker
        run: npx tsx src/main.ts
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WORKER_TIME_BUDGET: '480'
          WORKER_HARD_LIMIT_SECONDS: '780'   # the job is stopped at 15 min (setup included)
          REPO_PRIVATE: ${{ github.event.repository.private }}
      - name: Chain next run (work waiting)
        if: steps.work.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run worker.yml --repo "$GITHUB_REPOSITORY" --ref main
