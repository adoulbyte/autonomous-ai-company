name: Backup
# Daily encrypted logical backup of the production database, kept as a workflow artifact (30 days).
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ] || [ -z "${{ secrets.BACKUP_PASSPHRASE }}" ]; then echo "Backup secrets not set — skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install PostgreSQL 17 client
        if: steps.cfg.outputs.ok == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with: { node-version: 22 }
      - run: npm ci
        if: steps.cfg.outputs.ok == 'true'
        working-directory: worker
      - name: Dump, compress, encrypt
        if: steps.cfg.outputs.ok == 'true'
        env: { DATABASE_URL: '${{ secrets.SUPABASE_DB_URL }}', SUPABASE_URL: '${{ secrets.VITE_SUPABASE_URL }}', SUPABASE_DB_PASSWORD: '${{ secrets.SUPABASE_DB_PASSWORD }}', PASSPHRASE: '${{ secrets.BACKUP_PASSPHRASE }}' }
        run: |
          set -euo pipefail
          f="aic-$(date -u +%Y%m%dT%H%M%SZ).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$(cd worker && npx tsx src/normalizeDbUrl.ts)" --format=custom --no-owner --no-privileges --schema=public --schema=ops --file "$f"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
          rm "$f"; ls -la
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ok == 'true'
        with: { name: db-backup, path: '*.dump.gpg', retention-days: 30 }
